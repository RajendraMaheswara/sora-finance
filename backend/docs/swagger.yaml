host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: REST API untuk aplikasi keuangan Sora (hanya GET endpoints)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Sora Finance API
  version: "1.0"
paths:
  /customers:
    get:
      description: Mengembalikan daftar semua customer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Customer'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all customers
      tags:
      - Customers
  /customers/{id}:
    get:
      description: Mengembalikan satu customer berdasarkan ID
      parameters:
      - description: UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Customer'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get customer by ID
      tags:
      - Customers
  /finance-daily-discount-summaries:
    get:
      description: Mengembalikan daftar semua finance daily discount summaries
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.FinanceDailyDiscountSummary'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all finance daily discount summaries
      tags:
      - FinanceDailyDiscountSummaries
  /finance-daily-discount-summaries/{id}:
    get:
      description: Mengembalikan satu finance daily discount summary berdasarkan ID
      parameters:
      - description: UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
